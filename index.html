<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARM.IO+</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111018;overflow:hidden;font-family:sans-serif;}
canvas{display:block;}

/* MENU */
#menu{
position:fixed;inset:0;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:linear-gradient(180deg,#181622,#0e0c14);
color:#fff;z-index:20;
}
#title{
font-size:70px;
font-weight:900;
background:linear-gradient(45deg,#a855f7,#6366f1);
-webkit-background-clip:text;
color:transparent;
margin-bottom:20px;
}
button{
padding:14px 40px;margin:10px;
border:none;border-radius:999px;
font-size:18px;font-weight:bold;
cursor:pointer;
}
#single{background:#7c3aed;color:#fff;}
#multi{background:#333;color:#777;}

/* HUD */
#hud{
position:fixed;top:10px;left:10px;
color:#ddd;z-index:10;
background:rgba(20,18,30,0.7);
padding:10px 14px;border-radius:10px;
font-size:14px;
}

/* MINIMAP */
#minimap{
position:fixed;bottom:10px;right:10px;
width:150px;height:150px;
background:#0e0c14;border:2px solid #444;
border-radius:8px;
}

/* DEATH SCREEN */
#death{
position:fixed;inset:0;
display:none;
align-items:center;justify-content:center;
flex-direction:column;
background:rgba(0,0,0,0.7);
z-index:30;color:#fff;
}
#death h2{font-size:50px;margin-bottom:10px;}
#death button{background:#7c3aed;color:#fff;}

/* JOYSTICK */
#joystick{
position:fixed;bottom:30px;left:30px;
width:100px;height:100px;border-radius:50%;
background:rgba(255,255,255,0.08);
display:none;align-items:center;justify-content:center;
}
#knob{
width:50px;height:50px;border-radius:50%;
background:rgba(255,255,255,0.3);
}
@media(max-width:768px){#joystick{display:flex;}}
</style>
</head>

<body>

<div id="menu">
<div id="title">FARM.IO+</div>
<button id="single">Singleplayer</button>
<button id="multi">Multiplayer (soon)</button>
</div>

<canvas id="canvas"></canvas>
<canvas id="minimap"></canvas>

<div id="hud">
<div id="score"></div>
<div id="time"></div>
<div id="bestScore"></div>
<div id="bestTime"></div>
</div>

<div id="death">
<h2>You Died</h2>
<div id="countdown"></div>
<button id="again">Play Again</button>
<button id="exit">Exit to Lobby</button>
</div>

<div id="joystick"><div id="knob"></div></div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap');
const mctx=mini.getContext('2d');

const WORLD=3000;

let player,points,blobs;
let mouse={x:0,y:0};
let startTime=0;
let gameRunning=false;
let dead=false;

let bestScore=localStorage.getItem('bestScore')||0;
let bestTime=localStorage.getItem('bestTime')||0;

// resize
function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
window.addEventListener('resize',resize);
resize();

function rand(){return Math.random()*WORLD;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// BLOBS
function createBlob(){
let r=20+Math.random()*30;
return{
x:rand(),y:rand(),
r,
speed:Math.max(0.8,2.2-r*0.03),
angle:Math.random()*Math.PI*2,
wobble:Math.random()*100
};
}

function init(){
player={x:1500,y:1500,r:20,score:20};
points=Array.from({length:80},()=>({x:rand(),y:rand(),r:5}));
blobs=Array.from({length:6},createBlob);
startTime=Date.now();
dead=false;
document.getElementById('death').style.display='none';
}

function die(){
dead=true;
gameRunning=false;

let deathDiv=document.getElementById('death');
let cd=document.getElementById('countdown');
deathDiv.style.display='flex';

let t=3;
cd.textContent="Returning in "+t;

let interval=setInterval(()=>{
t--;
cd.textContent="Returning in "+t;
if(t<=0){
clearInterval(interval);
showMenu();
}
},1000);
}

function showMenu(){
document.getElementById('menu').style.display='flex';
document.getElementById('death').style.display='none';
}

// update
function update(){
let p=player;

let speed=Math.max(1.2,4-p.r*0.05);

// move
let dx=mouse.x-canvas.width/2;
let dy=mouse.y-canvas.height/2;
let d=Math.hypot(dx,dy);
if(d>10){
p.x+=(dx/d)*speed;
p.y+=(dy/d)*speed;
}

p.x=Math.max(p.r,Math.min(WORLD-p.r,p.x));
p.y=Math.max(p.r,Math.min(WORLD-p.r,p.y));

// eat points
for(let i=points.length-1;i>=0;i--){
if(dist(p,points[i])<p.r){
points.splice(i,1);
points.push({x:rand(),y:rand(),r:5});
p.score+=10;
p.r=p.score/2;
}
}

// blobs
for(let i=blobs.length-1;i>=0;i--){
let b=blobs[i];

b.angle+=Math.random()*0.2-0.1;
b.x+=Math.cos(b.angle)*b.speed;
b.y+=Math.sin(b.angle)*b.speed;

// bounce
if(b.x<b.r||b.x>WORLD-b.r)b.angle=Math.PI-b.angle;
if(b.y<b.r||b.y>WORLD-b.r)b.angle=-b.angle;

// fight
if(dist(p,b)<p.r+b.r){
if(p.r>b.r){
blobs.splice(i,1);
blobs.push(createBlob());
p.score+=50;
p.r=p.score/2;
}else{
die();
}
}
}

// HUD
let time=Math.floor((Date.now()-startTime)/1000);

if(p.score>bestScore){
bestScore=p.score;
localStorage.setItem('bestScore',bestScore);
}
if(time>bestTime){
bestTime=time;
localStorage.setItem('bestTime',bestTime);
}

document.getElementById('score').textContent="Score: "+Math.floor(p.score);
document.getElementById('time').textContent="Time: "+time+"s";
document.getElementById('bestScore').textContent="Best Score: "+bestScore;
document.getElementById('bestTime').textContent="Best Time: "+bestTime+"s";
}

// render
function render(){
let W=canvas.width,H=canvas.height;
let camX=player.x-W/2, camY=player.y-H/2;

// bg
ctx.fillStyle='#000';
ctx.fillRect(0,0,W,H);

ctx.fillStyle='#111018';
ctx.fillRect(-camX,-camY,WORLD,WORLD);

// blobs
for(let b of blobs){
let wob=Math.sin(Date.now()/200+b.wobble)*0.1;

ctx.save();
ctx.translate(b.x-camX,b.y-camY);
ctx.scale(1+wob,1-wob);

ctx.beginPath();
ctx.arc(0,0,b.r,0,Math.PI*2);
ctx.fillStyle='#ef4444';
ctx.fill();

// size text
ctx.fillStyle='#fff';
ctx.font=`${b.r*0.7}px sans-serif`;
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(Math.floor(b.r),0,2);

ctx.restore();
}

// player
let wob=Math.sin(Date.now()/150)*0.1;
ctx.save();
ctx.translate(player.x-camX,player.y-camY);
ctx.scale(1+wob,1-wob);

ctx.beginPath();
ctx.arc(0,0,player.r,0,Math.PI*2);
ctx.fillStyle='#a855f7';
ctx.fill();

// SIZE = SCORE
ctx.fillStyle='#fff';
ctx.font=`${player.r*0.6}px sans-serif`;
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(Math.floor(player.score),0,2);

ctx.restore();

// minimap
mctx.fillStyle="#0e0c14";
mctx.fillRect(0,0,150,150);

mctx.fillStyle="#a855f7";
mctx.fillRect(player.x/WORLD*150,player.y/WORLD*150,4,4);

mctx.fillStyle="red";
for(let b of blobs){
mctx.fillRect(b.x/WORLD*150,b.y/WORLD*150,2,2);
}
}

function loop(){
if(!gameRunning)return;
update();
render();
requestAnimationFrame(loop);
}

// buttons
document.getElementById('single').onclick=()=>{
document.getElementById('menu').style.display='none';
init();
gameRunning=true;
loop();
};

document.getElementById('again').onclick=()=>{
init();
gameRunning=true;
loop();
};

document.getElementById('exit').onclick=showMenu;

// mouse
window.addEventListener('mousemove',e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});
</script>
</body>
</html>
