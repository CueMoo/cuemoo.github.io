<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARM.IO+</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111018;overflow:hidden;font-family:sans-serif;}
canvas{display:block;}

#menu{
position:fixed;inset:0;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:linear-gradient(#181622,#0e0c14);
color:#fff;z-index:20;
}

#title{
font-size:64px;font-weight:900;
background:linear-gradient(45deg,#a855f7,#6366f1);
-webkit-background-clip:text;color:transparent;
margin-bottom:20px;
}

button{
padding:14px 40px;margin:8px;
border:none;border-radius:999px;
font-size:18px;font-weight:bold;
cursor:pointer;
}
#single{background:#7c3aed;color:#fff;}
#multi{background:#333;color:#777;}

#skins{
display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;
}
.skin{
width:30px;height:30px;border-radius:50%;
cursor:pointer;border:2px solid transparent;
}
.skin.selected{border:2px solid #a855f7;}

#hud{
position:fixed;top:10px;left:10px;
color:#ddd;background:rgba(20,18,30,0.7);
padding:10px;border-radius:10px;
z-index:10;
}

#minimap{
position:fixed;bottom:10px;right:10px;
width:150px;height:150px;background:#0e0c14;
border:2px solid #444;border-radius:8px;
}

#death{
position:fixed;inset:0;
display:none;align-items:center;justify-content:center;
flex-direction:column;background:rgba(0,0,0,0.7);
z-index:30;color:#fff;
}

#joystick{
position:fixed;bottom:30px;left:30px;
width:100px;height:100px;border-radius:50%;
background:rgba(255,255,255,0.08);
display:none;align-items:center;justify-content:center;
}
#knob{
width:50px;height:50px;border-radius:50%;
background:rgba(255,255,255,0.3);
}
@media(max-width:768px){#joystick{display:flex;}}
</style>
</head>

<body>

<div id="menu">
<div id="title">FARM.IO+</div>

<div id="skins">
<div class="skin" data-c="red" style="background:red"></div>
<div class="skin" data-c="orange" style="background:orange"></div>
<div class="skin" data-c="yellow" style="background:yellow"></div>
<div class="skin" data-c="green" style="background:green"></div>
<div class="skin" data-c="blue" style="background:blue"></div>
<div class="skin" data-c="pink" style="background:pink"></div>
<div class="skin" data-c="black" style="background:black;border:1px solid #555"></div>
<div class="skin" data-c="white" style="background:white"></div>
</div>

<button id="single">Singleplayer</button>
<button id="multi">Multiplayer (soon)</button>
</div>

<canvas id="canvas"></canvas>
<canvas id="minimap"></canvas>

<div id="hud">
<div id="score"></div>
<div id="time"></div>
</div>

<div id="death">
<h2>You Died</h2>
<div id="countdown"></div>
<button id="again">Play Again</button>
<button id="exit">Exit</button>
</div>

<div id="joystick"><div id="knob"></div></div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap');
const mctx=mini.getContext('2d');

const WORLD=3000;

let player,points,blobs;
let mouse={x:0,y:0};
let gameRunning=false,startTime=0;
let playerColor=localStorage.getItem('skin')||'white';

// resize
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener('resize',resize);resize();

function rand(){return Math.random()*WORLD;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// BLOBS
function createBlob(){
let r=20+Math.random()*30;
return{
x:rand(),y:rand(),
r,
speed:Math.max(0.6,2.2-r*0.03),
angle:Math.random()*Math.PI*2
};
}

function init(){
player={x:1500,y:1500,r:20,score:20};
points=Array.from({length:80},()=>({x:rand(),y:rand(),r:6,phase:Math.random()*10}));
blobs=Array.from({length:6},createBlob);
startTime=Date.now();
document.getElementById('death').style.display='none';
}

// death
function die(){
gameRunning=false;
let d=document.getElementById('death');
d.style.display='flex';

let t=3;
let cd=document.getElementById('countdown');
cd.textContent="Returning in "+t;

let int=setInterval(()=>{
t--;cd.textContent="Returning in "+t;
if(t<=0){clearInterval(int);showMenu();}
},1000);
}

function showMenu(){
document.getElementById('menu').style.display='flex';
document.getElementById('death').style.display='none';
}

// update
function update(){
let speed=Math.max(1.2,4-player.r*0.05);

let dx=mouse.x-canvas.width/2;
let dy=mouse.y-canvas.height/2;
let d=Math.hypot(dx,dy);

if(d>10){
player.x+=(dx/d)*speed;
player.y+=(dy/d)*speed;
}

// bounds
player.x=Math.max(player.r,Math.min(WORLD-player.r,player.x));
player.y=Math.max(player.r,Math.min(WORLD-player.r,player.y));

// points
for(let i=points.length-1;i>=0;i--){
if(dist(player,points[i])<player.r){
points.splice(i,1);
points.push({x:rand(),y:rand(),r:6,phase:Math.random()*10});
player.score+=10;
player.r=player.score/2;
}
}

// blobs
for(let b of blobs){
b.x+=Math.cos(b.angle)*b.speed;
b.y+=Math.sin(b.angle)*b.speed;

if(Math.random()<0.02)b.angle+=Math.random()-0.5;

if(b.x<b.r||b.x>WORLD-b.r)b.angle=Math.PI-b.angle;
if(b.y<b.r||b.y>WORLD-b.r)b.angle=-b.angle;

if(dist(player,b)<player.r+b.r){
if(player.r>b.r){
b.r=0;
player.score+=50;
player.r=player.score/2;
}else{
die();
}
}
}
}

// render
function render(){
let W=canvas.width,H=canvas.height;
let camX=player.x-W/2, camY=player.y-H/2;

// bg
ctx.fillStyle="#000";
ctx.fillRect(0,0,W,H);

ctx.fillStyle="#111018";
ctx.fillRect(-camX,-camY,WORLD,WORLD);

// points (VISIBLE NOW)
for(let pt of points){
let pulse=1+Math.sin(Date.now()/300+pt.phase)*0.3;
ctx.beginPath();
ctx.arc(pt.x-camX,pt.y-camY,pt.r*pulse,0,Math.PI*2);
ctx.fillStyle="#22c55e";
ctx.shadowColor="#22c55e";
ctx.shadowBlur=10;
ctx.fill();
ctx.shadowBlur=0;
}

// blobs
for(let b of blobs){
if(b.r<=0)continue;

ctx.beginPath();
ctx.arc(b.x-camX,b.y-camY,b.r,0,Math.PI*2);
ctx.fillStyle="#ef4444";
ctx.fill();

// size text
ctx.fillStyle="#fff";
ctx.font=`${b.r*0.5}px sans-serif`;
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(Math.floor(b.r),b.x-camX,b.y-camY);
}

// player
ctx.beginPath();
ctx.arc(player.x-camX,player.y-camY,player.r,0,Math.PI*2);
ctx.fillStyle=playerColor;
ctx.fill();

// score text
ctx.fillStyle=playerColor==="white"?"#000":"#fff";
ctx.font=`${player.r*0.5}px sans-serif`;
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(Math.floor(player.score),player.x-camX,player.y-camY);

// minimap
mctx.fillStyle="#0e0c14";
mctx.fillRect(0,0,150,150);

mctx.fillStyle=playerColor;
mctx.fillRect(player.x/WORLD*150,player.y/WORLD*150,4,4);

mctx.fillStyle="red";
for(let b of blobs){
mctx.fillRect(b.x/WORLD*150,b.y/WORLD*150,2,2);
}
}

// loop
function loop(){
if(!gameRunning)return;
update();
render();
requestAnimationFrame(loop);
}

// start
document.getElementById('single').onclick=()=>{
document.getElementById('menu').style.display='none';
init();
gameRunning=true;
loop();
};

// skins
document.querySelectorAll('.skin').forEach(el=>{
if(el.dataset.c===playerColor)el.classList.add('selected');

el.onclick=()=>{
document.querySelectorAll('.skin').forEach(s=>s.classList.remove('selected'));
el.classList.add('selected');
playerColor=el.dataset.c;
localStorage.setItem('skin',playerColor);
};
});

// buttons
document.getElementById('again').onclick=()=>{
init();gameRunning=true;loop();
};
document.getElementById('exit').onclick=showMenu;

// mouse
window.addEventListener('mousemove',e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});
</script>
</body>
</html>
