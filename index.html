<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FARM.IO+</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0c1017;overflow:hidden;font-family:'Segoe UI',sans-serif;}
canvas{display:block;}

#menu{
position:fixed;inset:0;z-index:30;
background:#0c1017;
display:flex;align-items:center;justify-content:center;flex-direction:column;
}
#menu.hidden{display:none;}
#menu h1{font-size:70px;color:#fff;}
#menu span{color:#34d399;}
#btn-start{
padding:16px 48px;background:#34d399;border:none;
border-radius:999px;font-size:20px;font-weight:bold;cursor:pointer;
}

#hud{
position:fixed;top:0;left:0;right:0;
display:flex;justify-content:space-between;
padding:10px;color:#fff;z-index:10;
}
</style>
</head>

<body>

<div id="menu">
<h1>FARM<span>.IO+</span></h1>
<button id="btn-start">PLAY</button>
</div>

<canvas id="canvas"></canvas>

<div id="hud">
<div id="score">0</div>
<div id="speed">1x</div>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

const WORLD_W=3000, WORLD_H=3000;
const BASE_SPEED=3.2;

let player,points,whites,cops;
let keys={},mouse={x:0,y:0};
let gameRunning=false;

// NEW SYSTEMS
let camSmoothX=0,camSmoothY=0;
let dashCooldown=0,dashActive=0;
let combo=0,comboTimer=0;
let particles=[];
let screenShake=0;

function randPos(){return{x:Math.random()*WORLD_W,y:Math.random()*WORLD_H};}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function createPoint(){return{...randPos(),r:6};}
function createWhite(){return{...randPos(),r:14,dx:1,dy:0};}
function createCop(){return{...randPos(),r:20,dx:1,dy:0};}

function init(){
player={x:1500,y:1500,r:18,speed:BASE_SPEED,score:0};
points=Array.from({length:100},createPoint);
whites=Array.from({length:8},createWhite);
cops=Array.from({length:4},createCop);
}

function spawnParticles(x,y){
for(let i=0;i<10;i++){
particles.push({
x,y,
dx:(Math.random()-0.5)*4,
dy:(Math.random()-0.5)*4,
life:30
});
}
}
 function update(){
let p=player;

// DASH
if(keys['shift']&&dashCooldown<=0){
dashActive=15;
dashCooldown=120;
}
dashCooldown--;

let boost=1;
if(dashActive>0){
dashActive--;
boost=2.5;
}

// movement
let dx=mouse.x-canvas.width/2;
let dy=mouse.y-canvas.height/2;
let d=Math.hypot(dx,dy);

if(d>10){
p.x+=(dx/d)*p.speed*boost;
p.y+=(dy/d)*p.speed*boost;
}

// bounds
p.x=Math.max(p.r,Math.min(WORLD_W-p.r,p.x));
p.y=Math.max(p.r,Math.min(WORLD_H-p.r,p.y));

// collect
for(let i=points.length-1;i>=0;i--){
if(dist(p,points[i])<p.r+points[i].r){
points.splice(i,1);
points.push(createPoint());

combo++;
comboTimer=120;

p.score+=10+combo*2;
p.r+=0.2;

// SIZE SLOW
p.speed=BASE_SPEED+Math.max(0,3-p.r*0.05);

spawnParticles(p.x,p.y);
}
}

// combo decay
comboTimer--;
if(comboTimer<=0)combo=0;

// cops
for(let c of cops){
let dx=p.x-c.x;
let dy=p.y-c.y;
let d=Math.hypot(dx,dy);

c.x+=(dx/d)*2;
c.y+=(dy/d)*2;

if(d< p.r+c.r){
screenShake=20;
p.score*=0.8;
p.x=1500;p.y=1500;
}
}

// particles
for(let i=particles.length-1;i>=0;i--){
let pr=particles[i];
pr.x+=pr.dx;
pr.y+=pr.dy;
pr.life--;
if(pr.life<=0)particles.splice(i,1);
}

// HUD
document.getElementById('score').textContent=Math.floor(p.score);
document.getElementById('speed').textContent=p.speed.toFixed(1);
}

function render(){
let W=canvas.width,H=canvas.height;
let p=player;

// CAMERA SMOOTH
camSmoothX+=((p.x-W/2)-camSmoothX)*0.08;
camSmoothY+=((p.y-H/2)-camSmoothY)*0.08;

let camX=camSmoothX;
let camY=camSmoothY;

// SHAKE
let sx=0,sy=0;
if(screenShake>0){
sx=(Math.random()-0.5)*screenShake;
sy=(Math.random()-0.5)*screenShake;
screenShake*=0.9;
}

ctx.setTransform(1,0,0,1,sx,sy);

// bg
ctx.fillStyle='#0c1017';
ctx.fillRect(0,0,W,H);

// points
ctx.fillStyle='lime';
for(let pt of points){
ctx.beginPath();
ctx.arc(pt.x-camX,pt.y-camY,pt.r,0,Math.PI*2);
ctx.fill();
}

// player
ctx.fillStyle='white';
ctx.beginPath();
ctx.arc(p.x-camX,p.y-camY,p.r,0,Math.PI*2);
ctx.fill();

// cops
ctx.fillStyle='red';
for(let c of cops){
ctx.beginPath();
ctx.arc(c.x-camX,c.y-camY,c.r,0,Math.PI*2);
ctx.fill();
}

// particles
ctx.fillStyle='yellow';
for(let pr of particles){
ctx.globalAlpha=pr.life/30;
ctx.beginPath();
ctx.arc(pr.x-camX,pr.y-camY,2,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=1;
}
}

function loop(){
if(!gameRunning)return;
update();
render();
requestAnimationFrame(loop);
}

function startGame(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
document.getElementById('menu').classList.add('hidden');

init();
gameRunning=true;
loop();
}

document.getElementById('btn-start').onclick=startGame;

window.addEventListener('mousemove',e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});

window.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
});

window.addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});
</script>
</body>
</html>
