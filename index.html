<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARM.IO+</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111018;overflow:hidden;font-family:sans-serif;}
canvas{display:block;}

#menu{
position:fixed;inset:0;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:linear-gradient(#181622,#0e0c14);
color:#fff;z-index:20;
}

#title{
font-size:64px;font-weight:900;
background:linear-gradient(45deg,#a855f7,#6366f1);
-webkit-background-clip:text;color:transparent;
margin-bottom:20px;
}

button{
padding:14px 40px;margin:8px;
border:none;border-radius:999px;
font-size:18px;font-weight:bold;
cursor:pointer;
}
#single{background:#7c3aed;color:#fff;}

#skins{
display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;
}
.skin{
width:30px;height:30px;border-radius:50%;
cursor:pointer;border:2px solid transparent;
}
.skin.selected{border:2px solid #a855f7;}

#hud{
position:fixed;top:10px;left:10px;
background:rgba(20,18,30,0.9);
padding:14px;border-radius:12px;
color:#fff;font-size:16px;
}

#leaderboard{
position:fixed;top:10px;right:10px;
background:rgba(20,18,30,0.9);
padding:14px;border-radius:12px;
color:#fff;font-size:16px;
width:160px;
}

#minimap{
position:fixed;bottom:10px;right:10px;
width:200px;height:200px;
background:#0e0c14;border:2px solid #444;
border-radius:10px;
}

#death{
position:fixed;inset:0;
display:none;align-items:center;justify-content:center;
flex-direction:column;background:rgba(0,0,0,0.7);
z-index:30;color:#fff;
}
</style>
</head>

<body>

<div id="menu">
<div id="title">FARM.IO+</div>

<div id="skins">
<div class="skin" data-c="red" style="background:red"></div>
<div class="skin" data-c="orange" style="background:orange"></div>
<div class="skin" data-c="yellow" style="background:yellow"></div>
<div class="skin" data-c="green" style="background:green"></div>
<div class="skin" data-c="blue" style="background:blue"></div>
<div class="skin" data-c="pink" style="background:pink"></div>
<div class="skin" data-c="black" style="background:black"></div>
<div class="skin" data-c="white" style="background:white"></div>
</div>

<button id="single">Play</button>
</div>

<canvas id="canvas"></canvas>
<canvas id="minimap"></canvas>

<div id="hud">
<div id="score"></div>
<div id="time"></div>
</div>

<div id="leaderboard">
<div><b>Leaderboard</b></div>
<div id="lb"></div>
</div>

<div id="death">
<h2>You Died</h2>
<div id="countdown"></div>
<button id="again">Play Again</button>
<button id="exit">Exit</button>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap');
const mctx=mini.getContext('2d');

const WORLD=3000;

let player,points,blobs;
let mouse={x:0,y:0};
let gameRunning=false,startTime=0;
let playerColor=localStorage.getItem('skin')||'white';

// resize
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener('resize',resize);resize();

function rand(){return Math.random()*WORLD;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// SAFE SIZE SYSTEM
function getRadius(score){
return Math.sqrt(score)*2;
}

// blobs
function createBlob(){
let score=200+Math.random()*800;
return{
x:rand(),y:rand(),
score,
angle:Math.random()*6
};
}

function init(){
player={x:1500,y:1500,score:100};
points=Array.from({length:80},()=>({x:rand(),y:rand()}));
blobs=Array.from({length:6},createBlob);
startTime=Date.now();
}

// death
function die(){
gameRunning=false;
let d=document.getElementById('death');
d.style.display='flex';

let t=3;
let cd=document.getElementById('countdown');
cd.textContent="Returning in "+t;

let int=setInterval(()=>{
t--;cd.textContent="Returning in "+t;
if(t<=0){clearInterval(int);showMenu();}
},1000);
}

function showMenu(){
document.getElementById('menu').style.display='flex';
document.getElementById('death').style.display='none';
}

// update
function update(){
let r=getRadius(player.score);
let speed=Math.max(1.5,5-r*0.05);

// move
let dx=mouse.x-canvas.width/2;
let dy=mouse.y-canvas.height/2;
let d=Math.hypot(dx,dy);

if(d>10){
player.x+=(dx/d)*speed;
player.y+=(dy/d)*speed;
}

// bounds
player.x=Math.max(r,Math.min(WORLD-r,player.x));
player.y=Math.max(r,Math.min(WORLD-r,player.y));

// points
for(let i=points.length-1;i>=0;i--){
if(dist(player,points[i])<r){
points.splice(i,1);
points.push({x:rand(),y:rand()});
player.score+=20;
}
}

// blobs
for(let b of blobs){
let br=getRadius(b.score);

b.x+=Math.cos(b.angle)*1.5;
b.y+=Math.sin(b.angle)*1.5;
if(Math.random()<0.02)b.angle+=Math.random()-0.5;

if(dist(player,b)<r+br){
if(player.score>b.score){
player.score+=b.score*0.5; // controlled growth
b.score=200+Math.random()*800;
b.x=rand();b.y=rand();
}else{
die();
}
}
}

// HUD
document.getElementById('score').textContent="Score: "+Math.floor(player.score);
document.getElementById('time').textContent="Time: "+Math.floor((Date.now()-startTime)/1000);

// leaderboard
let sorted=[...blobs,player].sort((a,b)=>b.score-a.score);
document.getElementById('lb').innerHTML=
sorted.slice(0,5).map((e,i)=>`${i+1}. ${Math.floor(e.score)}`).join("<br>");
}

// render
function render(){
let W=canvas.width,H=canvas.height;
let r=getRadius(player.score);
let camX=player.x-W/2, camY=player.y-H/2;

// bg
ctx.fillStyle="#000";
ctx.fillRect(0,0,W,H);

ctx.fillStyle="#111018";
ctx.fillRect(-camX,-camY,WORLD,WORLD);

// points
ctx.fillStyle="#22c55e";
for(let pt of points){
ctx.beginPath();
ctx.arc(pt.x-camX,pt.y-camY,4,0,Math.PI*2);
ctx.fill();
}

// blobs
for(let b of blobs){
let br=getRadius(b.score);
ctx.beginPath();
ctx.arc(b.x-camX,b.y-camY,br,0,Math.PI*2);
ctx.fillStyle="#ef4444";
ctx.fill();

ctx.fillStyle="#fff";
ctx.font=`${br*0.4}px sans-serif`;
ctx.textAlign='center';
ctx.fillText(Math.floor(b.score),b.x-camX,b.y-camY);
}

// player
ctx.beginPath();
ctx.arc(player.x-camX,player.y-camY,r,0,Math.PI*2);
ctx.fillStyle=playerColor;
ctx.fill();

ctx.fillStyle=playerColor==="white"?"#000":"#fff";
ctx.font=`${r*0.4}px sans-serif`;
ctx.textAlign='center';
ctx.fillText(Math.floor(player.score),player.x-camX,player.y-camY);

// minimap
mctx.fillStyle="#0e0c14";
mctx.fillRect(0,0,200,200);

mctx.fillStyle=playerColor;
mctx.fillRect(player.x/WORLD*200,player.y/WORLD*200,4,4);

mctx.fillStyle="red";
for(let b of blobs){
mctx.fillRect(b.x/WORLD*200,b.y/WORLD*200,2,2);
}
}

function loop(){
if(!gameRunning)return;
update();
render();
requestAnimationFrame(loop);
}

// start
document.getElementById('single').onclick=()=>{
document.getElementById('menu').style.display='none';
init();
gameRunning=true;
loop();
};

// skins
document.querySelectorAll('.skin').forEach(el=>{
if(el.dataset.c===playerColor)el.classList.add('selected');

el.onclick=()=>{
document.querySelectorAll('.skin').forEach(s=>s.classList.remove('selected'));
el.classList.add('selected');
playerColor=el.dataset.c;
localStorage.setItem('skin',playerColor);
};
});

// buttons
document.getElementById('again').onclick=()=>{
init();gameRunning=true;loop();
};
document.getElementById('exit').onclick=showMenu;

// mouse
window.addEventListener('mousemove',e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});
</script>
</body>
</html>
