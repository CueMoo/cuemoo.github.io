<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARM.IO+</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:sans-serif;}
canvas{display:block;}

#menu{
position:fixed;inset:0;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:#0c1017;color:#fff;
z-index:20;
}
button{
padding:14px 40px;margin:10px;
border:none;border-radius:999px;
font-size:18px;font-weight:bold;
cursor:pointer;
}
#single{background:#34d399;}
#multi{background:#555;color:#aaa;}

#hud{
position:fixed;top:10px;left:10px;
color:#fff;z-index:10;
background:rgba(0,0,0,0.5);
padding:10px 14px;border-radius:10px;
font-size:14px;
}

#minimap{
position:fixed;bottom:10px;right:10px;
width:150px;height:150px;
background:#000;border:2px solid #555;
border-radius:8px;
}

#joystick{
position:fixed;bottom:30px;left:30px;
width:100px;height:100px;border-radius:50%;
background:rgba(255,255,255,0.1);
display:none;align-items:center;justify-content:center;
}
#knob{
width:50px;height:50px;border-radius:50%;
background:rgba(255,255,255,0.3);
}
@media(max-width:768px){#joystick{display:flex;}}
</style>
</head>

<body>

<div id="menu">
<h1>FARM.IO+</h1>
<button id="single">Singleplayer</button>
<button id="multi">Multiplayer (soon)</button>
</div>

<canvas id="canvas"></canvas>
<canvas id="minimap"></canvas>

<div id="hud">
<div id="score"></div>
<div id="time"></div>
<div id="bestScore"></div>
<div id="bestTime"></div>
</div>

<div id="joystick"><div id="knob"></div></div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

const mini=document.getElementById('minimap');
const mctx=mini.getContext('2d');

const WORLD=3000;

let player,points,blobs,powerups;
let mouse={x:0,y:0};
let startTime=0;
let gameRunning=false;

let bestScore=localStorage.getItem('bestScore')||0;
let bestTime=localStorage.getItem('bestTime')||0;

// MOBILE
let joy=document.getElementById('joystick');
let joyActive=false, joyOrigin={x:0,y:0};

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
window.addEventListener('resize',resize);
resize();

function rand(){return Math.random()*WORLD;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// BLOBS
function createBlob(){
let r=15+Math.random()*25;
return{
x:rand(),y:rand(),
r,
speed:Math.max(0.8,2.2 - r*0.03),
angle:Math.random()*Math.PI*2
};
}

function init(){
player={x:1500,y:1500,r:20,score:0};
points=Array.from({length:80},()=>({x:rand(),y:rand(),r:5}));
blobs=Array.from({length:6},createBlob);
powerups=[];
startTime=Date.now();
}

function separate(a,b){
let d=dist(a,b)||1;
let overlap=(a.r+b.r)-d;
if(overlap>0){
let dx=(a.x-b.x)/d;
let dy=(a.y-b.y)/d;
a.x+=dx*overlap/2;
b.x-=dx*overlap/2;
a.y+=dy*overlap/2;
b.y-=dy*overlap/2;
}
}

function update(){
let p=player;

// SPEED
let speed=Math.max(1.2,4 - p.r*0.05);

// movement
let dx=mouse.x-canvas.width/2;
let dy=mouse.y-canvas.height/2;
let d=Math.hypot(dx,dy);

if(d>10){
p.x+=(dx/d)*speed;
p.y+=(dy/d)*speed;
}

// bounds
p.x=Math.max(p.r,Math.min(WORLD-p.r,p.x));
p.y=Math.max(p.r,Math.min(WORLD-p.r,p.y));

// points
for(let i=points.length-1;i>=0;i--){
if(dist(p,points[i])<p.r){
points.splice(i,1);
points.push({x:rand(),y:rand(),r:5});
p.score+=10;
p.r+=0.3;
}
}

// BLOBS
for(let i=blobs.length-1;i>=0;i--){
let b=blobs[i];

b.angle+=Math.random()*0.2-0.1;
b.x+=Math.cos(b.angle)*b.speed;
b.y+=Math.sin(b.angle)*b.speed;

if(b.x<b.r||b.x>WORLD-b.r)b.angle=Math.PI-b.angle;
if(b.y<b.r||b.y>WORLD-b.r)b.angle=-b.angle;

// collide blobs
for(let j=i+1;j<blobs.length;j++){
separate(b,blobs[j]);
}

// fight
if(dist(p,b)<p.r+b.r){
if(p.r>b.r){
blobs.splice(i,1);
blobs.push(createBlob());
p.score+=50;
p.r+=1;
}else{
p.score*=0.5;
p.x=1500;p.y=1500;
}
}
}

// HUD
let time=Math.floor((Date.now()-startTime)/1000);

if(p.score>bestScore){
bestScore=p.score;
localStorage.setItem('bestScore',bestScore);
}
if(time>bestTime){
bestTime=time;
localStorage.setItem('bestTime',bestTime);
}

document.getElementById('score').textContent="Score: "+Math.floor(p.score);
document.getElementById('time').textContent="Time: "+time+"s";
document.getElementById('bestScore').textContent="Best Score: "+bestScore;
document.getElementById('bestTime').textContent="Best Time: "+bestTime+"s";
}

function render(){
let W=canvas.width,H=canvas.height;
let camX=player.x-W/2, camY=player.y-H/2;

// black outside
ctx.fillStyle='#000';
ctx.fillRect(0,0,W,H);

// world
ctx.fillStyle='#0c1017';
ctx.fillRect(-camX,-camY,WORLD,WORLD);

// points
ctx.fillStyle='lime';
for(let pt of points){
ctx.beginPath();
ctx.arc(pt.x-camX,pt.y-camY,pt.r,0,Math.PI*2);
ctx.fill();
}

// blobs
for(let b of blobs){
let squish=1+Math.sin(Date.now()/200)*0.1;
ctx.save();
ctx.translate(b.x-camX,b.y-camY);
ctx.scale(squish,1/squish);
ctx.beginPath();
ctx.arc(0,0,b.r,0,Math.PI*2);
ctx.fillStyle='red';
ctx.fill();
ctx.restore();
}

// player
let squish=1+Math.sin(Date.now()/150)*0.1;
ctx.save();
ctx.translate(player.x-camX,player.y-camY);
ctx.scale(squish,1/squish);
ctx.beginPath();
ctx.arc(0,0,player.r,0,Math.PI*2);
ctx.fillStyle='white';
ctx.fill();
ctx.restore();

// minimap
mctx.fillStyle="#000";
mctx.fillRect(0,0,150,150);

mctx.fillStyle="white";
mctx.fillRect(player.x/WORLD*150,player.y/WORLD*150,3,3);

mctx.fillStyle="red";
for(let b of blobs){
mctx.fillRect(b.x/WORLD*150,b.y/WORLD*150,2,2);
}
}

function loop(){
if(!gameRunning)return;
update();
render();
requestAnimationFrame(loop);
}

// ✅ FIXED BUTTON
document.getElementById('single').addEventListener('click',()=>{
document.getElementById('menu').style.display='none';

// IMPORTANT: reset mouse to center so player moves immediately
mouse.x=canvas.width/2;
mouse.y=canvas.height/2;

init();
gameRunning=true;
loop();
});

// mouse
window.addEventListener('mousemove',e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});

// joystick
joy.addEventListener('touchstart',e=>{
joyActive=true;
let r=joy.getBoundingClientRect();
joyOrigin={x:r.left+r.width/2,y:r.top+r.height/2};
});
joy.addEventListener('touchmove',e=>{
if(!joyActive)return;
let t=e.touches[0];
let dx=t.clientX-joyOrigin.x;
let dy=t.clientY-joyOrigin.y;
mouse.x=canvas.width/2+dx*3;
mouse.y=canvas.height/2+dy*3;
});
joy.addEventListener('touchend',()=>joyActive=false);
</script>
</body>
</html>
