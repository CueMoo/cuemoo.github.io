<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARM.IO+</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0c1017;overflow:hidden;font-family:sans-serif;}
canvas{display:block;}

#menu{
position:fixed;inset:0;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:#0c1017;color:#fff;
z-index:20;
}
button{
padding:14px 40px;margin:10px;
border:none;border-radius:999px;
font-size:18px;font-weight:bold;
cursor:pointer;
}
#single{background:#34d399;}
#multi{background:#555;color:#aaa;}

#hud{
position:fixed;top:10px;left:10px;color:#fff;z-index:10;
}
#hud div{margin:4px 0;}

#joystick{
position:fixed;bottom:30px;left:30px;
width:100px;height:100px;border-radius:50%;
background:rgba(255,255,255,0.1);
display:none;align-items:center;justify-content:center;
}
#knob{
width:50px;height:50px;border-radius:50%;
background:rgba(255,255,255,0.3);
}
@media(max-width:768px){#joystick{display:flex;}}
</style>
</head>

<body>

<div id="menu">
<h1>FARM.IO+</h1>
<button id="single">Singleplayer</button>
<button id="multi">Multiplayer (soon)</button>
</div>

<canvas id="canvas"></canvas>

<div id="hud">
<div id="score">Score: 0</div>
<div id="time">Time: 0</div>
<div id="bestScore"></div>
<div id="bestTime"></div>
</div>

<div id="joystick"><div id="knob"></div></div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

let player,points,enemies,powerups;
let keys={},mouse={x:0,y:0};
let gameRunning=false;
let startTime=0;

let bestScore=localStorage.getItem('bestScore')||0;
let bestTime=localStorage.getItem('bestTime')||0;

// MOBILE
let joy=document.getElementById('joystick');
let knob=document.getElementById('knob');
let joyActive=false, joyOrigin={x:0,y:0};

const WORLD=3000;

function rand(){return Math.random()*WORLD;}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function init(){
player={x:1500,y:1500,r:20,speed:3,score:0};
points=Array.from({length:80},()=>({x:rand(),y:rand(),r:5}));
enemies=Array.from({length:6},()=>({x:rand(),y:rand(),r:18}));
powerups=[];
startTime=Date.now();
}

function spawnPowerup(){
let type=Math.random()<0.5?'score':'time';
powerups.push({x:rand(),y:rand(),r:10,type});
}

setInterval(spawnPowerup,5000);

// COLLISION PUSH
function separate(a,b){
let d=dist(a,b);
let overlap=(a.r+b.r)-d;
if(overlap>0){
let dx=(a.x-b.x)/d;
let dy=(a.y-b.y)/d;
a.x+=dx*overlap/2;
b.x-=dx*overlap/2;
a.y+=dy*overlap/2;
b.y-=dy*overlap/2;
}
}

function update(){
let p=player;

// movement
let dx=mouse.x-canvas.width/2;
let dy=mouse.y-canvas.height/2;
let d=Math.hypot(dx,dy);
if(d>10){
p.x+=(dx/d)*p.speed;
p.y+=(dy/d)*p.speed;
}

// bounds
p.x=Math.max(p.r,Math.min(WORLD-p.r,p.x));
p.y=Math.max(p.r,Math.min(WORLD-p.r,p.y));

// collect points
for(let i=points.length-1;i>=0;i--){
if(dist(p,points[i])<p.r){
points.splice(i,1);
points.push({x:rand(),y:rand(),r:5});
p.score+=10;
p.r+=0.2;
}
}

// enemies
for(let i=enemies.length-1;i>=0;i--){
let e=enemies[i];

// simple chase
let dx=p.x-e.x, dy=p.y-e.y;
let d=Math.hypot(dx,dy);
e.x+=(dx/d)*1.5;
e.y+=(dy/d)*1.5;

// collide enemies
for(let j=i+1;j<enemies.length;j++){
separate(e,enemies[j]);
}

// player vs enemy
if(dist(p,e)<p.r+e.r){
if(p.r>e.r){
enemies.splice(i,1);
p.score+=50;
p.r+=1;
}else{
p.score*=0.5;
p.x=1500;p.y=1500;
}
}
}

// powerups
for(let i=powerups.length-1;i>=0;i--){
let pw=powerups[i];
if(dist(p,pw)<p.r){
if(pw.type==='score')p.score+=100;
if(pw.type==='time')startTime+=5000;
powerups.splice(i,1);
}
}

// HUD
let time=Math.floor((Date.now()-startTime)/1000);

document.getElementById('score').textContent="Score: "+Math.floor(p.score);
document.getElementById('time').textContent="Time: "+time;

if(p.score>bestScore){
bestScore=p.score;
localStorage.setItem('bestScore',bestScore);
}
if(time>bestTime){
bestTime=time;
localStorage.setItem('bestTime',bestTime);
}

document.getElementById('bestScore').textContent="Best Score: "+bestScore;
document.getElementById('bestTime').textContent="Best Time: "+bestTime;
}

function render(){
let W=canvas.width,H=canvas.height;
let camX=player.x-W/2, camY=player.y-H/2;

ctx.fillStyle='#0c1017';
ctx.fillRect(0,0,W,H);

// points
ctx.fillStyle='lime';
for(let pt of points){
ctx.beginPath();
ctx.arc(pt.x-camX,pt.y-camY,pt.r,0,Math.PI*2);
ctx.fill();
}

// enemies
ctx.fillStyle='red';
for(let e of enemies){
ctx.beginPath();
ctx.arc(e.x-camX,e.y-camY,e.r,0,Math.PI*2);
ctx.fill();
}

// powerups
for(let pw of powerups){
ctx.fillStyle=pw.type==='score'?'gold':'cyan';
ctx.beginPath();
ctx.arc(pw.x-camX,pw.y-camY,pw.r,0,Math.PI*2);
ctx.fill();
}

// player
ctx.fillStyle='white';
ctx.beginPath();
ctx.arc(player.x-camX,player.y-camY,player.r,0,Math.PI*2);
ctx.fill();
}

function loop(){
if(!gameRunning)return;
update();
render();
requestAnimationFrame(loop);
}

document.getElementById('single').onclick=()=>{
document.getElementById('menu').style.display='none';
canvas.width=innerWidth;
canvas.height=innerHeight;
init();
gameRunning=true;
loop();
};

// mouse
window.addEventListener('mousemove',e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});

// joystick
joy.addEventListener('touchstart',e=>{
joyActive=true;
let r=joy.getBoundingClientRect();
joyOrigin={x:r.left+r.width/2,y:r.top+r.height/2};
});
joy.addEventListener('touchmove',e=>{
if(!joyActive)return;
let t=e.touches[0];
let dx=t.clientX-joyOrigin.x;
let dy=t.clientY-joyOrigin.y;
mouse.x=canvas.width/2+dx*3;
mouse.y=canvas.height/2+dy*3;
});
joy.addEventListener('touchend',()=>{
joyActive=false;
});

</script>
</body>
</html>
