<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FARM.IO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0c1017; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .hud-box {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 10px 18px;
    min-width: 80px;
  }
  .hud-val { font-size: 22px; font-weight: bold; color: #fff; }
  .hud-label { font-size: 11px; color: #666; text-transform: uppercase; }
  #speed-val { color: #f5c542; }
  #title-center { color: rgba(52,211,153,0.7); font-size: 13px; letter-spacing: 2px; margin-top: 6px; text-align:center; }

  #bust-flash {
    position: fixed; inset: 0; z-index: 25;
    background: rgba(239,68,68,0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }
  #bust-msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 26; color: #ef4444; font-size: 48px; font-weight: 900;
    pointer-events: none; opacity: 0;
    text-shadow: 0 0 30px red;
    transition: opacity 0.3s;
  }

  #menu {
    position: fixed; inset: 0; z-index: 30;
    background: #0c1017;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  #menu.hidden { display: none; }
  #menu h1 { font-size: 80px; font-weight: 900; color: #fff; line-height: 1; }
  #menu h1 span { color: #34d399; }
  #menu p { color: #555; font-size: 18px; margin: 12px 0 36px; }
  #btn-start {
    padding: 16px 48px; background: #34d399; color: #0c1017;
    border: none; border-radius: 999px; font-size: 20px; font-weight: bold;
    cursor: pointer; letter-spacing: 1px; transition: transform 0.1s;
  }
  #btn-start:hover { transform: scale(1.05); }
  #legend {
    margin-top: 36px; display: flex; gap: 24px; align-items: center;
  }
  .legend-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .legend-blob {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .legend-label { font-size: 11px; color: #555; }
  #controls-hint { margin-top: 20px; color: rgba(255,255,255,0.25); font-size: 12px; }
  #total-time-display { margin-top: 12px; color: rgba(52,211,153,0.5); font-size: 13px; }

  #joystick {
    position: fixed; bottom: 32px; left: 32px;
    width: 112px; height: 112px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    display: none; align-items: center; justify-content: center;
    touch-action: none; z-index: 15;
  }
  #joystick-knob {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.3);
  }
  @media (max-width: 768px) { #joystick { display: flex; } }
</style>
</head>
<body>

<div id="menu">
  <h1>FARM<span>.IO</span></h1>
  <p>Consume. Grow. Evade. Dominate.</p>
  <button id="btn-start">PLAY NOW</button>
  <div id="legend">
    <div class="legend-item">
      <div class="legend-blob" style="background:#111;border:2px solid rgba(255,255,255,0.2)">●</div>
      <div class="legend-label">You</div>
    </div>
    <div class="legend-item">
      <div class="legend-blob" style="background:rgba(255,255,255,0.9)"></div>
      <div class="legend-label">Prey</div>
    </div>
    <div class="legend-item">
      <div class="legend-blob" style="background:#dc2626">🚔</div>
      <div class="legend-label">Cops</div>
    </div>
  </div>
  <div id="controls-hint">Move your <strong style="color:#34d399">mouse</strong> — blob follows cursor</div>
  <div id="total-time-display"></div>
</div>

<canvas id="canvas"></canvas>

<div id="hud" class="hidden">
  <div class="hud-box">
    <div class="hud-val" id="score-val">0</div>
    <div class="hud-label">Score</div>
    <div style="font-size:11px;color:#555;margin-top:2px" id="best-display"></div>
  </div>
  <div>
    <div id="title-center">FARM.IO</div>
    <div style="text-align:center;margin-top:4px;color:rgba(255,255,255,0.4);font-size:13px" id="time-display">0:00</div>
    <div style="text-align:center;margin-top:2px;color:rgba(52,211,153,0.4);font-size:11px" id="total-display"></div>
  </div>
  <div class="hud-box" style="text-align:right">
    <div class="hud-val" id="speed-val">1.0x</div>
    <div class="hud-label">Speed</div>
    <div style="font-size:11px;color:#555;margin-top:2px" id="busts-display"></div>
  </div>
</div>

<div id="bust-flash"></div>
<div id="bust-msg">BUSTED!</div>

<div id="joystick"><div id="joystick-knob"></div></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── Change this to your GitHub raw image URL ──
// e.g. 'https://raw.githubusercontent.com/YOU/REPO/main/background.jpg'
const BG_IMAGE_URL = 'background.jpg';
const bgImg = new Image();
bgImg.src = BG_IMAGE_URL;

const WORLD_W = 3000, WORLD_H = 3000;
const BASE_SPEED = 3.2;       // faster base
const POINT_COUNT = 100, WHITE_COUNT = 8, COP_COUNT = 4;
const POINT_VALUE = 10, CATCH_BONUS = 50;
const MOUSE_DEADZONE = 18;    // px — stops moving when cursor is this close

let player, points, whites, cops, frameId, gameRunning;
let sessionStart = 0;         // ms when current session started
let sessionPaused = 0;        // accumulated ms from previous sessions
let busts = 0;
const keys = {};
const mouse = { x: -9999, y: -9999, worldX: 0, worldY: 0 };

let highScore = parseInt(localStorage.getItem('farmio_hs') || '0');
let totalTime  = parseInt(localStorage.getItem('farmio_time') || '0'); // seconds

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function randPos(m = 100) {
  return { x: m + Math.random() * (WORLD_W - m*2), y: m + Math.random() * (WORLD_H - m*2) };
}
function createPoint() {
  const n = 4 + Math.floor(Math.random() * 4);
  return {
    ...randPos(), radius: 5 + Math.random() * 4,
    particles: Array.from({length:n}, () => ({
      ox: (Math.random()-0.5)*14, oy: (Math.random()-0.5)*14, r: 2+Math.random()*2
    }))
  };
}
function createWhite() {
  const a = Math.random()*Math.PI*2;
  return { ...randPos(200), radius: 14+Math.random()*6,
    speed: BASE_SPEED*(0.9+Math.random()*0.4),
    dx: Math.cos(a), dy: Math.sin(a), turnTimer: 0 };
}
function createCop() {
  const a = Math.random()*Math.PI*2;
  return { ...randPos(200), radius: 20, speed: BASE_SPEED*0.75,
    dx: Math.cos(a), dy: Math.sin(a), turnTimer: 0, chasing: false };
}

function initPlayer() {
  player = { x: WORLD_W/2, y: WORLD_H/2, radius: 18, speed: BASE_SPEED, score: 0 };
}

function init() {
  busts = 0;
  initPlayer();
  points = Array.from({length:POINT_COUNT}, createPoint);
  whites = Array.from({length:WHITE_COUNT}, createWhite);
  cops   = Array.from({length:COP_COUNT}, createCop);
  sessionStart = Date.now();
  sessionPaused = 0;
}

function formatTime(sec) {
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

// Flash red + respawn (no game over)
function bust() {
  busts++;
  // Flash
  const flash = document.getElementById('bust-flash');
  const msg   = document.getElementById('bust-msg');
  flash.style.opacity = '1';
  msg.style.opacity   = '1';
  setTimeout(() => { flash.style.opacity='0'; msg.style.opacity='0'; }, 600);

  // Lose 20% score, respawn
  player.score = Math.floor(player.score * 0.8);
  player.x = WORLD_W/2; player.y = WORLD_H/2;
  player.radius = 18; player.speed = BASE_SPEED;

  // Scatter cops away
  for (const c of cops) {
    const a = Math.random()*Math.PI*2;
    c.x = 200 + Math.random()*(WORLD_W-400);
    c.y = 200 + Math.random()*(WORLD_H-400);
    c.dx = Math.cos(a); c.dy = Math.sin(a);
    c.chasing = false; c.turnTimer = 120;
  }

  updateHUD();
}

function updateHUD() {
  const elapsed = Math.floor((Date.now() - sessionStart + sessionPaused) / 1000);
  const total   = totalTime + elapsed;
  document.getElementById('score-val').textContent = player.score;
  document.getElementById('speed-val').textContent = player.speed.toFixed(1)+'x';
  document.getElementById('time-display').textContent = 'Session: ' + formatTime(elapsed);
  document.getElementById('total-display').textContent = 'Total: ' + formatTime(total);
  document.getElementById('busts-display').textContent = busts > 0 ? 'Busted: '+busts+'x' : '';
  document.getElementById('best-display').textContent  = highScore>0 ? 'Best: '+highScore : '';
}

function update() {
  const p = player;
  const W = canvas.width, H = canvas.height;

  // Mouse-following movement (slither.io style)
  const camX = p.x - W/2, camY = p.y - H/2;
  const wx = mouse.x + camX;
  const wy = mouse.y + camY;
  const dx = wx - p.x, dy = wy - p.y;
  const d  = Math.hypot(dx, dy);

  // Also allow keyboard
  let mx=0, my=0;
  if (keys['w']||keys['arrowup']) my-=1;
  if (keys['s']||keys['arrowdown']) my+=1;
  if (keys['a']||keys['arrowleft']) mx-=1;
  if (keys['d']||keys['arrowright']) mx+=1;

  if (mx||my) {
    const l=Math.hypot(mx,my);
    p.x+=(mx/l)*p.speed; p.y+=(my/l)*p.speed;
  } else if (d > MOUSE_DEADZONE && mouse.x > -9000) {
    p.x += (dx/d)*p.speed;
    p.y += (dy/d)*p.speed;
  }

  p.x = Math.max(p.radius, Math.min(WORLD_W-p.radius, p.x));
  p.y = Math.max(p.radius, Math.min(WORLD_H-p.radius, p.y));

  // Collect points
  for (let i=points.length-1;i>=0;i--) {
    if (dist(p,points[i]) < p.radius+points[i].radius) {
      points.splice(i,1); points.push(createPoint());
      p.score+=POINT_VALUE;
      p.speed=BASE_SPEED+p.score*0.002;
      p.radius=Math.min(40,18+p.score*0.015);
      if (p.score > highScore) { highScore=p.score; localStorage.setItem('farmio_hs',highScore); }
    }
  }

  // Catch whites
  for (let i=whites.length-1;i>=0;i--) {
    const w=whites[i];
    if (dist(p,w)<p.radius+w.radius*0.5 && p.radius>w.radius*0.8) {
      whites.splice(i,1); whites.push(createWhite());
      p.score+=CATCH_BONUS;
      p.speed=BASE_SPEED+p.score*0.002;
      p.radius=Math.min(40,18+p.score*0.015);
      if (p.score > highScore) { highScore=p.score; localStorage.setItem('farmio_hs',highScore); }
    }
  }

  // Move whites (flee)
  for (const w of whites) {
    w.turnTimer--;
    const wd=dist(p,w);
    if (wd<250) { const ax=(w.x-p.x)/wd, ay=(w.y-p.y)/wd; w.dx=w.dx*0.9+ax*0.1; w.dy=w.dy*0.9+ay*0.1; }
    else if (w.turnTimer<=0) { const a=Math.random()*Math.PI*2; w.dx=Math.cos(a); w.dy=Math.sin(a); w.turnTimer=60+Math.random()*120; }
    const l=Math.hypot(w.dx,w.dy)||1;
    w.x+=(w.dx/l)*w.speed; w.y+=(w.dy/l)*w.speed;
    if (w.x<w.radius||w.x>WORLD_W-w.radius){w.dx*=-1;w.x=Math.max(w.radius,Math.min(WORLD_W-w.radius,w.x));}
    if (w.y<w.radius||w.y>WORLD_H-w.radius){w.dy*=-1;w.y=Math.max(w.radius,Math.min(WORLD_H-w.radius,w.y));}
  }

  // Move cops (chase)
  for (const c of cops) {
    c.turnTimer--;
    const cd=dist(p,c);
    if (cd<400) {
      c.chasing=true;
      const ax=(p.x-c.x)/cd, ay=(p.y-c.y)/cd;
      c.dx=c.dx*0.88+ax*0.12; c.dy=c.dy*0.88+ay*0.12;
    } else {
      c.chasing=false;
      if (c.turnTimer<=0){const a=Math.random()*Math.PI*2;c.dx=Math.cos(a);c.dy=Math.sin(a);c.turnTimer=80+Math.random()*160;}
    }
    const spd=c.chasing?c.speed*1.3:c.speed;
    const l=Math.hypot(c.dx,c.dy)||1;
    c.x+=(c.dx/l)*spd; c.y+=(c.dy/l)*spd;
    if (c.x<c.radius||c.x>WORLD_W-c.radius){c.dx*=-1;c.x=Math.max(c.radius,Math.min(WORLD_W-c.radius,c.x));}
    if (c.y<c.radius||c.y>WORLD_H-c.radius){c.dy*=-1;c.y=Math.max(c.radius,Math.min(WORLD_H-c.radius,c.y));}
    if (cd < c.radius+p.radius*0.6) { bust(); return; }
  }

  updateHUD();
}

function render() {
  const W=canvas.width, H=canvas.height;
  const p=player;
  const camX=p.x-W/2, camY=p.y-H/2;
  const t=Date.now()/1000;

  // Background image (tiled if needed) or fallback color
  if (bgImg.complete && bgImg.naturalWidth > 0) {
    ctx.save();
    const pat = ctx.createPattern(bgImg, 'repeat');
    if (pat) {
      ctx.translate(-camX % bgImg.width, -camY % bgImg.height);
      ctx.fillStyle = pat;
      ctx.fillRect(camX % bgImg.width - bgImg.width, camY % bgImg.height - bgImg.height, W + bgImg.width*2, H + bgImg.height*2);
    }
    ctx.restore();
  } else {
    ctx.fillStyle='#0c1017'; ctx.fillRect(0,0,W,H);
    // grid
    ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
    const gs=60, sx=-(camX%gs), sy2=-(camY%gs);
    for(let x=sx;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=sy2;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }

  // World border
  ctx.strokeStyle='rgba(255,80,80,0.3)'; ctx.lineWidth=3;
  ctx.strokeRect(-camX,-camY,WORLD_W,WORLD_H);

  // Points
  for (const pt of points) {
    const sx=pt.x-camX, sy=pt.y-camY;
    if(sx<-30||sx>W+30||sy<-30||sy>H+30) continue;
    for(let i=0;i<pt.particles.length;i++){
      const pp=pt.particles[i];
      ctx.beginPath();
      ctx.arc(sx+pp.ox+Math.sin(t*2.5+i*1.3)*2, sy+pp.oy+Math.sin(t*2+i)*2, pp.r,0,Math.PI*2);
      ctx.fillStyle=`hsl(${130+i*8},75%,${45+i*4}%)`;
      ctx.shadowColor='hsl(145,70%,50%)'; ctx.shadowBlur=8; ctx.fill();
    }
    ctx.shadowBlur=0;
  }

  // White blobs
  for(let wi=0;wi<whites.length;wi++){
    const w=whites[wi];
    const sx=w.x-camX, sy=w.y-camY;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50) continue;
    const wb=1+Math.sin(t*3+wi*0.9)*0.08, sq=1-Math.sin(t*3+wi*0.9)*0.06;
    ctx.save(); ctx.translate(sx,sy); ctx.scale(wb,sq);
    ctx.beginPath(); ctx.arc(0,0,w.radius,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.shadowColor='white'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
    const eo=w.radius*0.3;
    ctx.fillStyle='#0c1017';
    ctx.beginPath();ctx.arc(-eo,-eo*0.5,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(eo,-eo*0.5,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Cops
  for(const c of cops){
    const sx=c.x-camX, sy=c.y-camY;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50) continue;
    ctx.beginPath(); ctx.arc(sx,sy,c.radius,0,Math.PI*2);
    ctx.fillStyle=c.chasing?'hsl(0,80%,50%)':'hsl(0,60%,45%)';
    ctx.shadowColor=c.chasing?'red':'hsl(0,60%,45%)'; ctx.shadowBlur=c.chasing?20:8;
    ctx.fill(); ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(sx,sy-c.radius*0.4,5,0,Math.PI*2);
    ctx.fillStyle=Date.now()%500<250?'#4488ff':'#ff4444'; ctx.fill();
    ctx.font=`${c.radius*0.6}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚔',sx,sy+2);
  }

  // Player
  const px=p.x-camX, py=p.y-camY;
  const pw=1+Math.sin(t*4)*0.05, ps=1-Math.sin(t*4)*0.04;
  ctx.save(); ctx.translate(px,py); ctx.scale(pw,ps);
  ctx.beginPath(); ctx.arc(0,0,p.radius,0,Math.PI*2);
  ctx.fillStyle='#111'; ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2;
  ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=15;
  ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
  const eo=p.radius*0.3;
  ctx.fillStyle='hsl(145,70%,50%)';
  ctx.beginPath();ctx.arc(-eo,-eo*0.5,3.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(eo,-eo*0.5,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Minimap
  const mmW=140,mmH=140,mmP=12;
  const mmX=W-mmW-mmP, mmY=H-mmH-mmP;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1;
  ctx.fillRect(mmX,mmY,mmW,mmH); ctx.strokeRect(mmX,mmY,mmW,mmH);
  ctx.fillStyle='hsl(145,70%,50%)';
  ctx.beginPath();ctx.arc(mmX+(p.x/WORLD_W)*mmW,mmY+(p.y/WORLD_H)*mmH,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='red';
  for(const c of cops){ctx.beginPath();ctx.arc(mmX+(c.x/WORLD_W)*mmW,mmY+(c.y/WORLD_H)*mmH,2,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(const w of whites){ctx.beginPath();ctx.arc(mmX+(w.x/WORLD_W)*mmW,mmY+(w.y/WORLD_H)*mmH,1.5,0,Math.PI*2);ctx.fill();}
}

function loop() {
  if (!gameRunning) return;
  update();
  render();
  frameId = requestAnimationFrame(loop);
}

function saveSession() {
  const elapsed = Math.floor((Date.now() - sessionStart + sessionPaused) / 1000);
  totalTime += elapsed;
  localStorage.setItem('farmio_time', totalTime);
}

function startGame() {
  init();
  gameRunning = true;
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('best-display').textContent=highScore>0?'Best: '+highScore:'';
  cancelAnimationFrame(frameId);
  loop();
}

window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
canvas.addEventListener('mouseleave',()=>{ mouse.x=-9999; mouse.y=-9999; });
window.addEventListener('beforeunload', saveSession);

document.getElementById('btn-start').addEventListener('click', startGame);

// Show total time on menu
(function() {
  const td = document.getElementById('total-time-display');
  if (totalTime > 0) td.textContent = 'Total playtime: ' + formatTime(totalTime);
})();

// Mobile joystick
const joy=document.getElementById('joystick'), knob=document.getElementById('joystick-knob');
let joyActive=false, joyOrigin={x:0,y:0};
joy.addEventListener('touchstart',e=>{
  e.preventDefault(); joyActive=true;
  const r=joy.getBoundingClientRect();
  joyOrigin={x:r.left+r.width/2, y:r.top+r.height/2};
},{passive:false});
joy.addEventListener('touchmove',e=>{
  e.preventDefault(); if(!joyActive)return;
  const t=e.touches[0];
  const dx=t.clientX-joyOrigin.x, dy=t.clientY-joyOrigin.y;
  const d=Math.min(Math.hypot(dx,dy),40), a=Math.atan2(dy,dx);
  knob.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;
  const th=10;
  keys['arrowleft']=dx<-th; keys['arrowright']=dx>th;
  keys['arrowup']=dy<-th; keys['arrowdown']=dy>th;
},{passive:false});
['touchend','touchcancel'].forEach(ev=>joy.addEventListener(ev,e=>{
  e.preventDefault(); joyActive=false;
  knob.style.transform='translate(0,0)';
  keys['arrowleft']=keys['arrowright']=keys['arrowup']=keys['arrowdown']=false;
},{passive:false}));
</script>
</body>
</html>
