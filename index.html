<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>FARM.IO</title>



<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body { background: #0c1017; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

canvas { display: block; }



#hud {

  position: fixed; top: 0; left: 0; right: 0;

  padding: 12px 16px;

  display: flex; justify-content: space-between;

  pointer-events: none; z-index: 10;

}



.hud-box {

  background: rgba(0,0,0,0.6);

  border: 1px solid rgba(255,255,255,0.1);

  border-radius: 12px; padding: 10px 18px;

}



.hud-val { font-size: 22px; font-weight: bold; color: #fff; }

.hud-label { font-size: 11px; color: #666; text-transform: uppercase; }



#menu {

  position: fixed; inset: 0;

  display: flex; flex-direction: column;

  align-items: center; justify-content: center;

  background: #0c1017;

}



#menu h1 { font-size: 80px; font-weight: 900; color: #fff; }

#menu h1 span { color: #34d399; }



#btn-start {

  padding: 16px 48px;

  background: #34d399;

  border: none;

  border-radius: 999px;

  font-size: 20px;

  cursor: pointer;

}

</style>

</head>



<body>



<div id="menu">

  <h1>FARM<span>.IO</span></h1>

  <button id="btn-start">PLAY</button>

</div>



<canvas id="canvas"></canvas>



<div id="hud">

  <div class="hud-box">

    <div id="score-val">0</div>

  </div>

  <div class="hud-box">

    <div id="time-display">0:00</div>

  </div>

</div>



<script>



const canvas = document.getElementById('canvas');

const ctx = canvas.getContext('2d');



const WORLD_W = 3000;

const WORLD_H = 3000;



const BASE_SPEED = 3.2;



let player, points, whites, cops;

let gameRunning = false;



// ✅ FIXED TIME SYSTEM

let sessionStart = 0;

let totalTime = parseInt(localStorage.getItem('farmio_time') || '0');



function formatTime(sec) {

  const m = Math.floor(sec/60);

  const s = sec % 60;

  return m + ':' + String(s).padStart(2,'0');

}



function saveSession() {

  const elapsed = Math.floor((Date.now() - sessionStart) / 1000);

  totalTime += elapsed;

  localStorage.setItem('farmio_time', totalTime);

}



window.addEventListener('beforeunload', saveSession);



function init() {

  player = {

    x: WORLD_W / 2,

    y: WORLD_H / 2,

    radius: 18,

    speed: BASE_SPEED,

    score: 0

  };



  points = [];

  whites = [];

  cops = [];



  for (let i = 0; i < 100; i++) {

    points.push({

      x: Math.random() * WORLD_W,

      y: Math.random() * WORLD_H,

      radius: 6

    });

  }



  sessionStart = Date.now();

}



function updateHUD() {

  const elapsed = Math.floor((Date.now() - sessionStart) / 1000);

  const total = totalTime + elapsed;



  document.getElementById('score-val').textContent = player.score;

  document.getElementById('time-display').textContent =

    formatTime(total);

}



document.getElementById('btn-start').onclick = () => {

  init();

  gameRunning = true;



  canvas.width = window.innerWidth;

  canvas.height = window.innerHeight;



  loop();

};



// ───────── INPUT ─────────

const keys = {};

const mouse = { x: 0, y: 0 };



window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);

window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);



canvas.addEventListener('mousemove', e => {

  mouse.x = e.clientX;

  mouse.y = e.clientY;

});



// ───────── HELPERS ─────────

function dist(a, b) {

  return Math.hypot(a.x - b.x, a.y - b.y);

}



// ───────── UPDATE ─────────

function update() {

  const p = player;



  // Movement (mouse follow)

  const dx = mouse.x - canvas.width / 2;

  const dy = mouse.y - canvas.height / 2;

  const d = Math.hypot(dx, dy);



  if (d > 10) {

    p.x += (dx / d) * p.speed;

    p.y += (dy / d) * p.speed;

  }



  // Clamp to world

  p.x = Math.max(p.radius, Math.min(WORLD_W - p.radius, p.x));

  p.y = Math.max(p.radius, Math.min(WORLD_H - p.radius, p.y));



  // ───────── POINTS (VISIBLE FIX) ─────────

  for (let i = points.length - 1; i >= 0; i--) {

    if (dist(p, points[i]) < p.radius + points[i].radius) {

      points.splice(i, 1);

      points.push({

        x: Math.random() * WORLD_W,

        y: Math.random() * WORLD_H,

        radius: 6

      });



      p.score += 10;

      p.speed = BASE_SPEED + p.score * 0.002;

    }

  }



  updateHUD();

}



// ───────── RENDER ─────────

function render() {

  const W = canvas.width;

  const H = canvas.height;

  const p = player;



  const camX = p.x - W / 2;

  const camY = p.y - H / 2;



  // Background

  ctx.fillStyle = "#0c1017";

  ctx.fillRect(0, 0, W, H);



  // ───────── BORDER (VISIBLE FIX) ─────────

  ctx.strokeStyle = "rgba(255,0,0,0.9)";

  ctx.lineWidth = 6;

  ctx.shadowColor = "red";

  ctx.shadowBlur = 15;

  ctx.strokeRect(-camX, -camY, WORLD_W, WORLD_H);

  ctx.shadowBlur = 0;



  // ───────── POINTS (GLOW FIX) ─────────

  for (const pt of points) {

    const x = pt.x - camX;

    const y = pt.y - camY;



    // glow ring

    ctx.beginPath();

    ctx.arc(x, y, pt.radius + 6, 0, Math.PI * 2);

    ctx.strokeStyle = "rgba(0,255,150,0.4)";

    ctx.lineWidth = 2;

    ctx.stroke();



    // core

    ctx.beginPath();

    ctx.arc(x, y, pt.radius, 0, Math.PI * 2);

    ctx.fillStyle = "#00ff88";

    ctx.shadowColor = "#00ffcc";

    ctx.shadowBlur = 20;

    ctx.fill();

    ctx.shadowBlur = 0;

  }



  // ───────── PLAYER ─────────

  const px = p.x - camX;

  const py = p.y - camY;



  ctx.beginPath();

  ctx.arc(px, py, p.radius, 0, Math.PI * 2);

  ctx.fillStyle = "#111";

  ctx.strokeStyle = "white";

  ctx.lineWidth = 2;

  ctx.fill();

  ctx.stroke();

}



// ───────── LOOP ─────────

function loop() {

  if (!gameRunning) return;

  update();

  render();

  requestAnimationFrame(loop);

}
